<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>{% block title %}FastKanban — Zen Minimalist{% endblock %}</title>

  <!-- Google Fonts & Material Icons -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#faf9f5",
            "surface-dim": "#dbdad6",
            "surface-bright": "#faf9f5",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f4f4f0",
            "surface-container": "#efeeea",
            "surface-container-high": "#e9e8e4",
            "surface-container-highest": "#e3e2df",
            "on-surface": "#1b1c1a",
            "on-surface-variant": "#45474a",
            "primary": "#07080a",
            "on-primary": "#ffffff",
            "primary-container": "#1f2022",
            "on-primary-container": "#87878a",
            "secondary": "#5b5e64",
            "on-secondary": "#ffffff",
            "secondary-container": "#e0e2e9",
            "on-secondary-container": "#61646a",
            "outline": "#76777b",
            "outline-variant": "#c6c6ca",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "cinnabar": "#a34a42",
            "lichen": "#5e7a63",
            "amber-raw": "#b38038",
            "indigo-stone": "#53677a"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "sm": "0.125rem",
            "md": "0.375rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          spacing: {
            "gutter": "0.75rem",
            "gutter-desktop": "1rem",
            "margin": "1rem",
            "margin-desktop": "1.5rem",
            "space-xs": "0.25rem",
            "space-sm": "0.375rem",
            "space-md": "0.625rem",
            "space-lg": "1rem",
            "space-xl": "1.5rem"
          },
          fontFamily: {
            "sans": ["Inter", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>

  <!-- HTMX & SortableJS -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #faf9f5;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 350, 'GRAD' 0, 'opsz' 20;
      display: inline-block;
      vertical-align: middle;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .kanban-cards-container:has(.kanban-card) .empty-placeholder { display: none !important; }
  </style>
</head>
<body class="bg-surface text-on-surface font-sans min-h-screen flex flex-col antialiased selection:bg-surface-container-high">
  {% block content %}{% endblock %}

  <!-- Modal Container for dynamic HTMX dialogs -->
  <div id="modal-container"></div>
</body>
</html>
