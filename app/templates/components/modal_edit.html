{# Edit Card Modal Component matching Stitch Zen Design #}
<div id="edit-modal-backdrop"
     class="fixed inset-0 bg-on-surface/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 transition-opacity"
     onclick="if(event.target === this) document.getElementById('modal-container').innerHTML = '';">

  <div class="bg-surface-container-lowest max-w-lg w-full rounded-md border border-hairline shadow-zen-lg p-5 flex flex-col gap-4 relative"
       role="dialog"
       aria-modal="true"
       aria-labelledby="modal-card-title">

    <!-- Modal Header -->
    <div class="flex items-center justify-between pb-2 border-b border-hairline">
      <div class="flex items-center gap-2">
        <span class="font-mono text-xs text-secondary font-semibold">
          {{ card.code_id or "TASK-" ~ card.id[-4:] }}
        </span>
        <span class="text-xs text-outline">•</span>
        <span class="font-mono text-xs text-on-surface-variant uppercase tracking-wider">
          Edit Card
        </span>
      </div>

      <button type="button"
              class="w-7 h-7 flex items-center justify-center rounded-xs text-secondary hover:text-on-surface hover:bg-surface-container transition-colors"
              onclick="document.getElementById('modal-container').innerHTML = '';"
              aria-label="Close dialog">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>

    <!-- Edit Form -->
    <form id="card-edit-form"
          class="flex flex-col gap-3.5"
          hx-put="/cards/{{ card.id }}"
          hx-target="#card-{{ card.id }}"
          hx-swap="outerHTML">

      <!-- Title Input -->
      <div class="flex flex-col gap-1">
        <label for="edit-title" class="font-mono text-xs text-on-surface-variant font-medium">
          Title <span class="text-cinnabar">*</span>
        </label>
        <input id="edit-title"
               type="text"
               name="title"
               required
               value="{{ card.title }}"
               class="w-full bg-surface-container-low/50 border border-hairline focus:border-primary rounded-xs px-3 py-1.5 text-xs text-on-surface placeholder-outline focus:outline-none transition-colors"
               placeholder="Task title"/>
        {% if error %}
          <div id="edit-form-error" class="text-xs text-cinnabar font-mono mt-0.5">
            {{ error }}
          </div>
        {% endif %}
      </div>

      <!-- Description Input -->
      <div class="flex flex-col gap-1">
        <label for="edit-desc" class="font-mono text-xs text-on-surface-variant font-medium">
          Description
        </label>
        <textarea id="edit-desc"
                  name="description"
                  rows="3"
                  class="w-full bg-surface-container-low/50 border border-hairline focus:border-primary rounded-xs px-3 py-1.5 text-xs text-on-surface placeholder-outline focus:outline-none resize-none transition-colors"
                  placeholder="Add detailed context or checklist...">{{ card.description or '' }}</textarea>
      </div>

      <!-- Color / Priority Label Selector -->
      <div class="flex flex-col gap-1.5">
        <label class="font-mono text-xs text-on-surface-variant font-medium">
          Priority & Color Tag
        </label>
        <div class="flex flex-wrap items-center gap-2">
          <!-- Default -->
          <label class="flex items-center gap-1.5 px-2.5 py-1 rounded-xs border border-hairline text-xs cursor-pointer hover:bg-surface-container transition-colors has-[:checked]:border-on-surface has-[:checked]:bg-surface-container-low font-mono">
            <input type="radio" name="color" value="default" class="sr-only" {% if card.color == 'default' or not card.color %}checked{% endif %}/>
            <span class="w-1.5 h-1.5 rounded-full bg-outline"></span>
            <span>Normal</span>
          </label>

          <!-- Red / Urgent -->
          <label class="flex items-center gap-1.5 px-2.5 py-1 rounded-xs border border-hairline text-xs cursor-pointer hover:bg-surface-container transition-colors has-[:checked]:border-cinnabar has-[:checked]:bg-error-container/20 font-mono">
            <input type="radio" name="color" value="red" class="sr-only" {% if card.color == 'red' %}checked{% endif %}/>
            <span class="w-1.5 h-1.5 rounded-full bg-cinnabar"></span>
            <span>Urgent</span>
          </label>

          <!-- Yellow / Active -->
          <label class="flex items-center gap-1.5 px-2.5 py-1 rounded-xs border border-hairline text-xs cursor-pointer hover:bg-surface-container transition-colors has-[:checked]:border-amber-raw has-[:checked]:bg-amber-100/30 font-mono">
            <input type="radio" name="color" value="yellow" class="sr-only" {% if card.color == 'yellow' %}checked{% endif %}/>
            <span class="w-1.5 h-1.5 rounded-full bg-amber-raw"></span>
            <span>Active</span>
          </label>

          <!-- Green / Done -->
          <label class="flex items-center gap-1.5 px-2.5 py-1 rounded-xs border border-hairline text-xs cursor-pointer hover:bg-surface-container transition-colors has-[:checked]:border-lichen has-[:checked]:bg-green-100/30 font-mono">
            <input type="radio" name="color" value="green" class="sr-only" {% if card.color == 'green' %}checked{% endif %}/>
            <span class="w-1.5 h-1.5 rounded-full bg-lichen"></span>
            <span>Lichen</span>
          </label>

          <!-- Blue / Info -->
          <label class="flex items-center gap-1.5 px-2.5 py-1 rounded-xs border border-hairline text-xs cursor-pointer hover:bg-surface-container transition-colors has-[:checked]:border-indigo-stone has-[:checked]:bg-blue-100/30 font-mono">
            <input type="radio" name="color" value="blue" class="sr-only" {% if card.color == 'blue' %}checked{% endif %}/>
            <span class="w-1.5 h-1.5 rounded-full bg-indigo-stone"></span>
            <span>Stone</span>
          </label>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-end gap-2 pt-2 border-t border-hairline mt-1">
        <button type="button"
                class="px-3 py-1.5 rounded-xs text-secondary hover:text-on-surface hover:bg-surface-container font-mono text-xs transition-colors"
                onclick="document.getElementById('modal-container').innerHTML = '';">
          Cancel
        </button>
        <button type="submit"
                class="px-4 py-1.5 rounded-xs bg-primary text-on-primary hover:bg-primary-container font-mono text-xs font-medium transition-colors shadow-zen-xs">
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  // Close modal on Escape key
  (function() {
    const escHandler = function(e) {
      if (e.key === 'Escape') {
        const container = document.getElementById('modal-container');
        if (container) container.innerHTML = '';
        document.removeEventListener('keydown', escHandler);
      }
    };
    document.addEventListener('keydown', escHandler);
  })();
</script>
