services:
  kanban:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastkanban
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/kanban.db
      - REPO_TYPE=sqlite
    volumes:
      - kanban-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

volumes:
  kanban-data:
